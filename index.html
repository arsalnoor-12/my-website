<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS LEVEL 1</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div id="h1">
        <h1>FILL THE FORM</h1>
    </div>
     
 <div id="form">
    <label for="name">Name:</label>
    <input type="text" name="name" placeholder="Enter your name">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" name="email" placeholder="Enter your email">
    <br><br>

    <label for="phone">Cell No:</label>
    <input type="tel" name="phone" placeholder="Enter your contact number">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender">Male
    <input type="radio" name="gender">Female  
    <br><br>

    <label for="password" >Password:</label>
    <input type="password" name="password" placeholder="Enter your password">
    <br><br>

    <label>Select your city:</label>
    <select>
        <option value="" disabled selected>Choose your city</option>
        <option>New York</option>
        <option>Los Angeles</option>
        <option>Chicago</option>
    </select>
    <br><br>

    <label>Choose your skills:</label>
    <input type="checkbox" name="skill">HTML
    <input type="checkbox" name="skill">CSS 
    <input type="checkbox" name="skill">JavaScript
    <br><br>

    <label>Comments:</label>
    <textarea rows="4" cols="20" placeholder="Enter your comments"></textarea>
    <br><br>

    <button>Submit Form</button>

</div>
</body>
</html>
